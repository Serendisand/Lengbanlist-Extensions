name: 发布扩展

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Tag（例如 v1.0.0），必须已存在'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发时检出指定 tag；tag 推送时用 github.ref
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 检出核心仓库
        uses: actions/checkout@v4
        with:
          repository: Serendisand/Lengbanlist
          path: .core

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装契约模块
        run: mvn -B -q -f .core/pom.xml -pl lengbanlist-api -am install -DskipTests

      - name: 构建扩展
        run: mvn -B -DskipTests package

      - name: 创建 Release 并上传 jar
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时必须显式提供 tag_name
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: '*/target/Lengbanlist-Ext-*.jar'
          generate_release_notes: true

      - name: 回写 index.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 手动触发时用输入的 tag，否则用 ref_name
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python3 .github/update_release_index.py

      - name: 提交 index.json
        run: |
          git config user.name "Lengbanlist Bot"
          git config user.email "bot@lengbanlist-extensions.local"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: 发布 ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} 回写索引"
          # 手动触发时 HEAD 是 detached（tag 的提交），先 rebase 到 main 再推送，避免非快进
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
