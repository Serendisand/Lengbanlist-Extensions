name: 发布扩展

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 手动触发时检出 main；tag 推送时检出该 tag
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 检出核心仓库
        uses: actions/checkout@v4
        with:
          repository: Serendisand/Lengbanlist
          path: .core

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装契约模块
        run: mvn -B -q -f .core/pom.xml -pl lengbanlist-api -am install -DskipTests

      - name: 构建扩展
        run: mvn -B -DskipTests package

      - name: 创建 Release 并上传 jar
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时用输入的版本号；tag 推送时用 ref_name。
          # 若 tag 不存在，该 Action 会基于当前 commit 自动创建。
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: '*/target/Lengbanlist-Ext-*.jar'
          generate_release_notes: true
          # 重跑时若 Release 已存在，覆盖它而不是失败
          overwrite: true

      - name: 回写 index.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: python3 .github/update_release_index.py

      - name: 提交 index.json
        run: |
          git config user.name "Lengbanlist Bot"
          git config user.email "bot@lengbanlist-extensions.local"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: 发布 ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }} 回写索引"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
